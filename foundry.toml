# Full reference https://github.com/foundry-rs/foundry/tree/master/crates/config

[profile.default]
  auto_detect_solc = false
  block_timestamp = 1_680_220_800 # March 31, 2023 at 00:00 GMT
  bytecode_hash = "none"
  evm_version = "cancun"           # See https://www.evmdiff.com/features?name=PUSH0&kind=opcode
  fuzz = { runs = 1_000 }
  via-ir = true
  gas_reports = ["*"]
  optimizer = true
  optimizer_runs = 200
  out = "out"
  script = "scripts"
  solc = "0.8.27"
  src = "contracts"
  test = "test"
  cache_path  = "cache_forge"
  libs = ["node_modules", "lib"]
  gas_reports_ignore = ["MockToken"]
  fs_permissions = [
    { access = "read", path = "script/deploy/artifacts"},
    { access = "read", path = "script/deploy"},
    { access = "read", path = "script/bash-deploy/artifacts"},
    { access = "write", path = "script/bash-deploy/deployment"},
    { access = "read", path = "script/bash-deploy/deployment"},
    { access = "read", path = "../v2-core/script/output"}
  ]

[profile.ci]
  fuzz = { runs = 1_000 }
  verbosity = 3

# Used by script/bash-deploy/deploy-nexus.sh: restricts the compile scope to the
# deploy script only, so `forge script --broadcast` never finds a locally-built
# Nexus artifact whose bytecode differs from the canonical precompiled artifacts
# (a mismatch makes forge abort the broadcast while decoding constructor args).
[profile.deploy]
  src = "script/foundry"
  test = "script/foundry"
  script = "script/foundry"

[profile.via-ir]
  via-ir = true

[fmt]
  bracket_spacing = true
  int_types = "long"
  line_length = 120
  multiline_func_header = "all"
  number_underscore = "thousands"
  quote_style = "double"
  tab_width = 4
  wrap_comments = true

[lint]
  lint_on_build = true
  ignore = [
    # Test files
    "test/*/*.t.sol",
    "test/*.t.sol",
    "test/**/*.t.sol",

    # Mock contracts
    "test/mock/*.sol",
    "contracts/mock/*.sol",
    "**/mock/*.sol",

    # Specific file patterns that are often problematic
    "**/*Mock*.sol",
    "**/*Test*.sol",

    # Audited composability submodule — pinned to bcnmy/erc8211-contracts@17a81c4.
    # Linting the audited source here would diverge from the audit target.
    "lib/erc8211-contracts/**/*.sol",
  ]
  severity = ["high", "med", "gas"]

